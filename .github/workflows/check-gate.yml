name: Check Gate promotions

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '5,35 * * * *'
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      source_group:
        description: 'Which production source group to check'
        required: true
        default: fast
        type: choice
        options:
          - fast
          - half-hour
          - hourly
      test_notification:
        description: 'Send one silent Futures Lottery test notification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gate-telegram-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bot source
        uses: actions/checkout@v4

      - name: Select source group
        id: source
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SOURCE: ${{ inputs.source_group || 'fast' }}
        run: |
          case "$EVENT_SCHEDULE" in
            '*/10 * * * *') source_group=fast ;;
            '5,35 * * * *') source_group=half-hour ;;
            '15 * * * *') source_group=hourly ;;
            '') source_group="$MANUAL_SOURCE" ;;
            *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
          esac
          echo "source_group=$source_group" >> "$GITHUB_OUTPUT"

      - name: Collect Gate promotions in browser
        run: node scripts/scrape-gate-promotions.js --source=${{ steps.source.outputs.source_group }} > /tmp/gate-promotions.json

      - name: Trigger protected Vercel check
        env:
          CHECK_URL: ${{ secrets.VERCEL_CHECK_URL }}
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          test -n "$CHECK_URL"
          test -n "$CHECK_SECRET"
          extra_header=()
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            extra_header=(-H "X-Gate-Bot-Test: true")
          fi
          curl --fail-with-body --silent --show-error --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $CHECK_SECRET" \
            -H "Content-Type: application/json" \
            "${extra_header[@]}" \
            --data-binary @/tmp/gate-promotions.json \
            "$CHECK_URL"
