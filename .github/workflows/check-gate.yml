name: Check Gate partner activity

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send Rewards Hub, Upcoming, and Fixed Rewards tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gate-telegram-notifier-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bot source
        uses: actions/checkout@v4

      - name: Collect Gate promotions in browser
        env:
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: node scripts/scrape-gate-promotions.js > /tmp/gate-promotions.json

      - name: Trigger protected Vercel check
        env:
          CHECK_URL: ${{ secrets.VERCEL_CHECK_URL }}
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          test -n "$CHECK_URL"
          test -n "$CHECK_SECRET"
          extra_header=()
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            extra_header=(-H "X-Gate-Bot-Test: true")
          fi
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $CHECK_SECRET" \
            -H "Content-Type: application/json" \
            "${extra_header[@]}" \
            --data-binary @/tmp/gate-promotions.json \
            "$CHECK_URL"
