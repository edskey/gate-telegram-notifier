name: Check Gate promotions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      source_group:
        description: 'Which production source group to check'
        required: true
        default: all
        type: choice
        options:
          - all
          - fast
          - half-hour
          - hourly
      test_notification:
        description: 'Send one silent Futures Lottery test notification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gate-telegram-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bot source
        uses: actions/checkout@v4

      - name: Select source group
        id: source
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SOURCE: ${{ inputs.source_group || 'all' }}
        run: |
          case "$EVENT_SCHEDULE" in
            '*/30 * * * *') source_group=all ;;
            '0,30 * * * *') source_group=all ;;
            '') source_group="$MANUAL_SOURCE" ;;
            *) source_group=all ;;
          esac
          echo "source_group=$source_group" >> "$GITHUB_OUTPUT"

      - name: Collect Gate promotions in browser
        run: node scripts/scrape-gate-promotions.js --source=${{ steps.source.outputs.source_group }} > /tmp/gate-promotions.json

      - name: Trigger protected Vercel check
        env:
          CHECK_URL: ${{ secrets.VERCEL_CHECK_URL }}
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          test -n "$CHECK_URL"
          test -n "$CHECK_SECRET"
          extra_header=()
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            extra_header=(-H "X-Gate-Bot-Test: true")
          fi
          curl --fail-with-body --silent --show-error --max-time 20             --retry 3             --retry-all-errors             --retry-delay 2             -X POST             -H "Authorization: Bearer $CHECK_SECRET"             -H "Content-Type: application/json"             "${extra_header[@]}"             --data-binary @/tmp/gate-promotions.json             "$CHECK_URL"
